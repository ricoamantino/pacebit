name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WXT_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.WXT_GOOGLE_OAUTH_CLIENT_ID }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate CI configuration
        shell: bash
        run: |
          if [[ -z "$WXT_GOOGLE_OAUTH_CLIENT_ID" ]]; then
            echo "::error::Configure the WXT_GOOGLE_OAUTH_CLIENT_ID repository variable."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check quality
        run: pnpm check

      - name: Build extension
        run: pnpm build

      - name: Package extension
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm zip

      - name: Upload extension package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacebit-chrome-mv3-${{ github.sha }}
          path: .output/pacebit-*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
